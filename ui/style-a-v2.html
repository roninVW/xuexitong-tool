  :root { --work-c1: #C4763F; --exam-c1: #9E3B31; }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #E8EAEE;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1B1F24;
  }

  /* ============================================================
     原型控制条（不属于 App，仅用于演示"可调节"）
     ============================================================ */
  .ctrl {
    display: flex; align-items: center; gap: 14px;
    margin: 18px auto 0; padding: 10px 18px; width: max-content; max-width: 92vw;
    background: #FFF; border: 1px solid #E3E6EB; border-radius: 999px;
    box-shadow: 0 6px 18px -12px rgba(16,24,40,.25);
    font-size: 12px; color: #475467;
  }
  .ctrl b { font-weight: 650; color: #101828; }
  .ctrl input[type="range"] { width: 168px; accent-color: #B4552D; }
  .ctrl .val { font-variant-numeric: tabular-nums; color: #B4552D; font-weight: 700; min-width: 44px; }
  .ctrl .div { width: 1px; height: 16px; background: #E3E6EB; }
  .ctrl .font-tag { display: flex; align-items: center; gap: 6px; color: #667085; }
  .ctrl .font-tag i { width: 6px; height: 6px; border-radius: 50%; background: #12B76A; }
  .ctrl .swatch { display: flex; align-items: center; gap: 6px; }
  .ctrl input[type="color"] { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
  .ctrl input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .ctrl input[type="color"]::-webkit-color-swatch { border: 1px solid #DDE1E7; border-radius: 6px; }

  /* ============================================================
     舞台
     ============================================================ */
  .stage { display: flex; gap: 44px; padding: 26px 48px 48px; justify-content: center; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .col-label { font-size: 11px; letter-spacing: .14em; color: #6B7280; text-align: center; }
  .col-label b { display: block; font-size: 14.5px; letter-spacing: 0; color: #111827; margin-top: 5px; font-weight: 650; }

  .phone {
    position: relative; width: 390px; height: 844px; border-radius: 46px; overflow: hidden;
    box-shadow: 0 0 0 9px #0B0C0E, 0 0 0 10px #2A2D33, 0 30px 70px -20px rgba(10,15,25,.55);
    background: var(--paper);
    --blur: 24px;
  }

  /* ============================================================
     纯色纸张令牌
     ============================================================ */
  .phone[data-mode="light"] {
    --paper: #F6F0E2;
    --card: #FFFDF7;
    --line: #E6DAC0;
    --line-soft: #D9CCAF;
    --ink: #2B2419;
    --ink-2: #6F6146;
    --muted: #9C8B67;
    --accent: #B4552D;
    --accent-soft: rgba(180,85,45,.12);
    --mark: #F2D06B;
    --mark-soon: #F5C08A;
    --mark-hot: #F0A6A0;
    --badge-ink: #4A3A12;
    --badge-ink-soon: #6B3A0C;
    --badge-ink-hot: #6E1D17;
    --glass-rgb: 255,253,247;
    --glass-a: .55;
    --glass-line: rgba(210,196,166,.75);
    --icon: #6F6146;
    color: var(--ink);
  }
  .phone[data-mode="dark"] {
    --paper: #151517;
    --card: #1E1E21;
    --line: #2B2B2F;
    --line-soft: #35353A;
    --ink: #EDEDEF;
    --ink-2: #B5B5B9;
    --muted: #86868C;
    --accent: #E08A5B;
    --accent-soft: rgba(224,138,91,.16);
    --mark: rgba(242,208,107,.26);
    --mark-soon: rgba(240,160,90,.26);
    --mark-hot: rgba(226,110,100,.28);
    --badge-ink: #F6DE9A;
    --badge-ink-soon: #F6C08A;
    --badge-ink-hot: #F3A79C;
    --glass-rgb: 30,30,34;
    --glass-a: .60;
    --glass-line: rgba(255,255,255,.08);
    --icon: #B5B5B9;
    color: var(--ink);
  }

  /* ============================================================
     顶栏：左「作业 ⌄」类型入口 + 右筛选入口
     ============================================================ */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 0 12px 8px 14px;
    background: rgba(var(--glass-rgb), var(--glass-a));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
    backdrop-filter: blur(var(--blur)) saturate(170%);
    border-bottom: 1px solid var(--glass-line);
    box-shadow: 0 10px 24px -22px rgba(60,38,8,.55);
  }
  .statusbar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px; font-size: 12px; font-weight: 650; color: var(--ink-2);
  }
  .statusbar .right { display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: .06em; }
  .bat { width: 18px; height: 9px; border: 1px solid currentColor; border-radius: 2.5px; position: relative; opacity: .7; display: inline-block; }
  .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 68%; background: currentColor; border-radius: 1px; }

  .barrow { display: flex; align-items: center; justify-content: space-between; }
  .typebtn {
    display: inline-flex; align-items: center; gap: 5px; height: 42px; padding: 0 6px 0 2px;
    border: 0; background: transparent; font: inherit; cursor: pointer; color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-size: 21px; font-weight: 700; letter-spacing: .05em;
  }
  .typebtn .chev { width: 15px; height: 15px; margin-top: 3px; opacity: .55; }
  .typebtn.open .chev { transform: rotate(180deg); }

  .filterbtn {
    position: relative; width: 40px; height: 40px; border-radius: 12px;
    border: 0; background: transparent; color: var(--icon); cursor: pointer;
    display: grid; place-items: center;
  }
  .filterbtn.on { background: var(--accent-soft); color: var(--accent); }
  .filterbtn svg { width: 21px; height: 21px; display: block; }
  .filterbtn .badge-dot {
    position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px rgba(var(--glass-rgb), .9);
  }

  .syncrow { display: flex; align-items: center; gap: 6px; padding: 4px 2px 0; font-size: 10.5px; color: var(--muted); }
  .syncrow .quote { margin-left: auto; max-width: 58%; border: 0; background: none; padding: 0; cursor: pointer;
    font-family: "Noto Serif SC", "Songti SC", serif; font-size: 10px; letter-spacing: .02em;
    color: var(--muted); opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: #7C9A5B; box-shadow: 0 0 0 3px rgba(124,154,91,.16); flex: 0 0 6px; }
  .phone[data-mode="dark"] .pulse { background: #93B06A; box-shadow: 0 0 0 3px rgba(147,176,106,.14); }

  /* ============================================================
     二级菜单（浮层）
     ============================================================ */
  .menu {
    position: absolute; z-index: 30;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px -18px rgba(40,24,6,.45), 0 2px 6px -2px rgba(40,24,6,.12);
  }

  .menu-type { top: 116px; left: 14px; width: 190px; border-radius: 14px; padding: 6px; }
  .mi {
    width: 100%; height: 42px; border: 0; background: transparent; cursor: pointer; font: inherit;
    display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 9px; color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: 15px; letter-spacing: .03em;
  }
  .mi .ck { width: 16px; height: 16px; opacity: 0; color: var(--accent); flex: 0 0 16px; }
  .mi.active { background: var(--accent-soft); color: var(--accent); }
  .mi.active .ck { opacity: 1; }
  .mi .cnt { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .mi.active .cnt { color: var(--accent); }

  .menu-filter { top: 114px; right: 12px; width: 304px; border-radius: 16px; padding: 14px 14px 12px; }
  .m-label { margin: 0 0 8px; font-size: 10px; letter-spacing: .16em; color: var(--muted); }
  .m-label + .m-grid, .m-label + .m-wrap { margin-bottom: 14px; }
  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .m-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill {
    border: 1px solid var(--line-soft); background: transparent; color: var(--ink-2);
    font: inherit; font-size: 12px; height: 32px; padding: 0 11px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .m-grid .pill { justify-content: space-between; }
  .pill b { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .pill.active b { color: var(--paper); opacity: .7; }
  .m-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px dashed var(--line-soft); }
  .m-foot .reset { border: 0; background: transparent; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 2px; }
  .m-foot .sum { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ============================================================
     列表
     ============================================================ */
  .content { position: relative; z-index: 1; padding-top: 122px; height: 100%; overflow: hidden; }
  .list { padding: 0 18px; }
  .group { margin-top: 12px; }
  .group-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .group-head .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
  .group-head .g-name { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: 12.5px; color: var(--ink-2); letter-spacing: .06em; }
  .group-head::after {
    content: ""; flex: 1; order: 1; height: 1px; margin-left: 2px;
    background: repeating-linear-gradient(90deg, var(--line-soft) 0 3px, transparent 3px 7px);
  }
  .group-head .g-count { order: 2; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 10px; padding: 10px 11px 10px 16px; margin-bottom: 7px;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--card);
  }
  /* 光效：从左边沿渗进卡片，向右淡出（只有左侧，没有顶部受光） */
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 58%;
    pointer-events: none; z-index: 0;
    background: linear-gradient(90deg, var(--g1) 0%, var(--g2) 30%, transparent 76%);
  }
  /* 左边沿的一条亮线，给光效一个明确的起点 */
  .card::after {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
    border-radius: 0 3px 3px 0; z-index: 0;
    background: linear-gradient(180deg, var(--c1), var(--c2));
    box-shadow: 0 0 14px 0 var(--glow);
  }
  .card[data-type="work"] {
    --c1: var(--work-c1, #C4763F);
    --c2: color-mix(in srgb, var(--c1) 50%, #FFEDC4);
    --g1: color-mix(in srgb, var(--c1) 23%, transparent);
    --g2: color-mix(in srgb, var(--c2) 7%, transparent);
    --glow: color-mix(in srgb, var(--c1) 55%, transparent);
  }
  .card[data-type="exam"] {
    --c1: var(--exam-c1, #9E3B31);
    --c2: color-mix(in srgb, var(--c1) 50%, #FFD2BC);
    --g1: color-mix(in srgb, var(--c1) 25%, transparent);
    --g2: color-mix(in srgb, var(--c2) 8%, transparent);
    --glow: color-mix(in srgb, var(--c1) 55%, transparent);
  }
  .phone[data-mode="dark"] .card[data-type="work"] {
    --c2: color-mix(in srgb, var(--c1) 45%, #FFD9A0);
    --g1: color-mix(in srgb, var(--c1) 26%, transparent);
    --g2: color-mix(in srgb, var(--c2) 9%, transparent);
    --glow: color-mix(in srgb, var(--c1) 42%, transparent);
  }
  .phone[data-mode="dark"] .card[data-type="exam"] {
    --c2: color-mix(in srgb, var(--c1) 45%, #FFC7AE);
    --g1: color-mix(in srgb, var(--c1) 28%, transparent);
    --g2: color-mix(in srgb, var(--c2) 10%, transparent);
    --glow: color-mix(in srgb, var(--c1) 45%, transparent);
  }
  .card-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .card-side { position: relative; z-index: 1; }
  .card h3 {
    margin: 0 0 5px; font-size: 13px; font-weight: 600; line-height: 1.35; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .kind {
    font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
    background: color-mix(in srgb, var(--c1) 13%, transparent); color: var(--c1);
  }
  .phone[data-mode="dark"] .kind { background: color-mix(in srgb, var(--c1) 20%, transparent); color: var(--c2); }

  .card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
  .metarow { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .metarow .course { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jump {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px;
    height: 20px; padding: 0 6px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-soft); background: rgba(var(--glass-rgb), .55);
    color: var(--ink-2); font-size: 9.5px; letter-spacing: .02em;
  }
  .jump svg { width: 10px; height: 10px; display: block; }
  .phone[data-mode="dark"] .jump { background: rgba(255,255,255,.04); }

  .badge {
    flex: 0 0 auto; font-size: 11.5px; font-weight: 700; padding: 3px 6px; border-radius: 2px; white-space: nowrap;
    background: linear-gradient(transparent 42%, var(--mark) 42%, var(--mark) 94%, transparent 94%);
    color: var(--badge-ink); font-variant-numeric: tabular-nums;
  }
  .badge.soon { background: linear-gradient(transparent 42%, var(--mark-soon) 42%, var(--mark-soon) 94%, transparent 94%); color: var(--badge-ink-soon); }
  .badge.hot  { background: linear-gradient(transparent 42%, var(--mark-hot) 42%, var(--mark-hot) 94%, transparent 94%); color: var(--badge-ink-hot); }

  /* ============================================================
     Dock：M3 NavigationBar + 可调模糊
     ============================================================ */
  .dock {
    position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 20;
    height: 66px; border-radius: 33px;
    display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
    background: rgba(var(--glass-rgb), var(--glass-a));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
    backdrop-filter: blur(var(--blur)) saturate(170%);
    border: 1px solid var(--glass-line);
    box-shadow: 0 10px 30px -14px rgba(20,12,0,.45), inset 0 1px 0 rgba(255,255,255,.28);
  }
  /* 暗色模式：去掉 dock 顶部那道光 */
  .phone[data-mode="dark"] .dock {
    box-shadow: 0 10px 30px -14px rgba(0,0,0,.55);
  }
  .nav {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; color: var(--icon); border: 0; background: transparent; font: inherit; cursor: pointer; padding: 0;
  }
  .nav .ind { width: 54px; height: 28px; border-radius: 14px; display: grid; place-items: center; }
  .nav .lb { font-size: 10px; line-height: 1; }
  .nav.on { color: var(--accent); }
  .nav.on .ind { background: var(--accent-soft); }
  .nav svg { width: 20px; height: 20px; display: block; }

  /* 科目色 */
  .dot.math { background: #B4552D; } .dot.cs { background: #3E7C6A; }
  .dot.phy  { background: #3E6E8E; } .dot.en { background: #7A5EA8; }
  .dot.pol  { background: #9B4444; }
  .phone[data-mode="dark"] .dot.math { background: #E08A5B; }
  .phone[data-mode="dark"] .dot.cs   { background: #6FB89A; }
  .phone[data-mode="dark"] .dot.phy  { background: #7BA9C9; }
  .phone[data-mode="dark"] .dot.en   { background: #A48BF0; }
  .phone[data-mode="dark"] .dot.pol  { background: #C97B72; }

  /* 滚动状态：让内容穿过顶栏，用来验证顶栏模糊 */
  .phone.scrolled .content { transform: translateY(-46px); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-assign" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="3.5" width="15" height="17" rx="2.6"></rect>
    <path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4.5"></path>
  </symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5.5" width="17" height="15" rx="2.6"></rect>
    <path d="M3.5 10.2h17M8.2 3.4v4.2M15.8 3.4v4.2"></path>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 19v-5.5M12 19V7M18 19v-8.5"></path>
  </symbol>
  <symbol id="i-tune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5h16M4 15.5h16"></path>
    <circle cx="9.2" cy="8.5" r="2.2"></circle>
    <circle cx="15" cy="15.5" r="2.2"></circle>
  </symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9.5l6 6 6-6"></path>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5l4.5 4.5L19 7.5"></path>
  </symbol>
</svg>

<div class="ctrl">
  <span>毛玻璃强度</span>
  <input id="blurRange" type="range" min="0" max="40" step="2" value="24">
  <span class="val" id="blurVal">24 px</span>
  <span class="div"></span>
  <span class="font-tag"><i></i>字体：Noto Serif SC 子集 · 已嵌入</span>
  <span class="div"></span>
  <label class="swatch"><span>作业色</span><input type="color" id="cWork" value="#C4763F"></label>
  <label class="swatch"><span>考试色</span><input type="color" id="cExam" value="#9E3B31"></label>
</div>

<div class="stage" id="stage"></div>

<script>
/* ---------------- 数据 ---------------- */
const DATA = {
  type: '作业',
  sync: '刚刚同步 · 8 门课 · 46 项',
  quote: '保持热爱，奔赴山海',
  types: [ { name: '作业', count: 46, active: true }, { name: '考试', count: 9 } ],
  statuses: [
    { name: '未完成', count: 7, active: true }, { name: '待批阅', count: 3 },
    { name: '已完成', count: 12 }, { name: '已过期', count: 4 }
  ],
  subjects: [ { name: '全部', active: true }, { name: '数学' }, { name: '计算机' }, { name: '物理' }, { name: '英语' }, { name: '思政' } ],
  groups: [
    { name: '数学', cls: 'math', items: [
      { t: '第七章 微分方程 习题 7.1–7.4', k: '作业', c: '高等数学A(上)', d: '8天13时' },
      { t: '习题 4.3 特征值与特征向量', k: '作业', c: '线性代数', d: '3天2时', s: 'soon' },
      { t: '第八章 级数 习题 8.1–8.2', k: '作业', c: '高等数学A(上)', d: '9天4时' }
    ]},
    { name: '计算机', cls: 'cs', items: [
      { t: '实验四：图的最短路径', k: '实验', c: '数据结构', d: '21时', s: 'hot' }
    ]},
    { name: '物理', cls: 'phy', items: [
      { t: '期中测验（第 1–5 章）', k: '考试', c: '大学物理(下)', d: '2天9时', s: 'soon' }
    ]},
    { name: '英语', cls: 'en', items: [
      { t: 'Unit 5 Essay Draft', k: '作业', c: '大学英语读写II', d: '4天1时' }
    ]},
    { name: '思政', cls: 'pol', items: [
      { t: '第三章 思考题（3.1–3.4）', k: '作业', c: '马克思主义基本原理', d: '6天4时' }
    ]}
  ]
};

/* ---------------- 片段 ---------------- */
const icon = (id, cls = '') => `<svg class="${cls}"><use href="#${id}"/></svg>`;

const typeMenu = () => `
  <div class="menu menu-type" role="menu">
    ${DATA.types.map(t => `
      <button class="mi ${t.active ? 'active' : ''}">
        ${icon('i-check', 'ck')}<span>${t.name}</span><span class="cnt">${t.count}</span>
      </button>`).join('')}
  </div>`;

const filterMenu = () => `
  <div class="menu menu-filter">
    <p class="m-label">状态</p>
    <div class="m-grid">
      ${DATA.statuses.map(s => `<button class="pill ${s.active ? 'active' : ''}">${s.name}<b>${s.count}</b></button>`).join('')}
    </div>
    <p class="m-label">科目</p>
    <div class="m-wrap">
      ${DATA.subjects.map(s => `<button class="pill ${s.active ? 'active' : ''}">${s.name}</button>`).join('')}
    </div>
    <div class="m-foot"><button class="reset">重置筛选</button><span class="sum">当前 7 项</span></div>
  </div>`;

const card = it => `
  <article class="card" data-type="${it.k === '考试' ? 'exam' : 'work'}">
    <div class="card-main">
      <h3>${it.t}</h3>
      <div class="metarow">
        <span class="kind">${it.k}</span>
        <span class="course">${it.c}</span>
      </div>
    </div>
    <div class="card-side">
      <div class="badge ${it.s || ''}">${it.d}</div>
      <button class="jump" title="在手机上打开学习通" aria-label="在手机上打开学习通">
        <span>打开</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 15.5L15.5 8.5M9.9 8.5h5.6v5.6"/>
        </svg>
      </button>
    </div>
  </article>`;

const group = g => `
  <section class="group">
    <div class="group-head"><i class="dot ${g.cls}"></i><span class="g-name">${g.name}</span><span class="g-count">${g.items.length}</span></div>
    ${g.items.map(card).join('')}
  </section>`;

const phone = (mode, menu, scrolled) => `
  <div class="phone ${scrolled ? 'scrolled' : ''}" data-mode="${mode}">
    <header class="topbar">
      <div class="statusbar"><span>9:41</span><span class="right"><span class="bat"></span>100%</span></div>
      <div class="barrow">
        <button class="typebtn ${menu === 'type' ? 'open' : ''}">
          <span>${DATA.type}</span>${icon('i-chev', 'chev')}
        </button>
        <button class="filterbtn ${menu === 'filter' ? 'on' : ''}">
          ${icon('i-tune')}${menu === 'filter' ? '' : '<i class="badge-dot"></i>'}
        </button>
      </div>
      <div class="syncrow"><i class="pulse"></i><span>${DATA.sync}</span><button class="quote" type="button" title="换一句（联网）">「${DATA.quote}」</button></div>
    </header>

    <div class="content"><div class="list">${DATA.groups.map(group).join('')}</div></div>

    ${menu === 'type' ? typeMenu() : ''}
    ${menu === 'filter' ? filterMenu() : ''}

    <nav class="dock">
      <button class="nav on"><span class="ind">${icon('i-assign')}</span><span class="lb">作业</span></button>
      <button class="nav"><span class="ind">${icon('i-cal')}</span><span class="lb">课表</span></button>
      <button class="nav"><span class="ind">${icon('i-chart')}</span><span class="lb">统计</span></button>
      <button class="nav"><span class="ind">${icon('i-tune')}</span><span class="lb">设置</span></button>
    </nav>
  </div>`;

/* ---------------- 挂载 ---------------- */
const variants = [
  { mode: 'light', menu: null,   scrolled: false, title: '浅色 · 手账版',   sub: '暖金＝作业　朱红＝考试' },
  { mode: 'dark',  menu: null,   scrolled: false, title: '深色 · 手账版',   sub: '同一套布局，只换颜色' },
  { mode: 'light', menu: 'type', scrolled: false, title: '浅色 · 类型菜单', sub: '左上「作业 ⌄」切换类型' }
];

document.getElementById('stage').innerHTML = variants.map(v => `
  <div class="col">
    <div class="col-label">${v.title}<b>${v.sub}</b></div>
    ${phone(v.mode, v.menu, v.scrolled)}
  </div>`).join('');

/* ---------------- 模糊滑块 ---------------- */
const range = document.getElementById('blurRange');
const out = document.getElementById('blurVal');
function applyBlur(v) {
  document.querySelectorAll('.phone').forEach(p => p.style.setProperty('--blur', v + 'px'));
  // 模糊越弱，玻璃越实，避免"零模糊却还是半透明"的违和
  const a = (0.94 - (v / 40) * 0.36).toFixed(2);
  document.querySelectorAll('.phone').forEach(p => p.style.setProperty('--glass-a', a));
  out.textContent = v + ' px';
}
range.addEventListener('input', e => applyBlur(+e.target.value));

/* ---------------- 类型光效取色 ---------------- */
const cWork = document.getElementById('cWork'), cExam = document.getElementById('cExam');
function applyColors() {
  document.documentElement.style.setProperty('--work-c1', cWork.value);
  document.documentElement.style.setProperty('--exam-c1', cExam.value);
}
const _q = new URLSearchParams(location.search);
if (_q.has('work')) cWork.value = '#' + _q.get('work');
if (_q.has('exam')) cExam.value = '#' + _q.get('exam');
cWork.addEventListener('input', applyColors);
cExam.addEventListener('input', applyColors);
applyColors();

/* ---------------- 一言：联网刷新 ---------------- */
async function refreshQuote() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 4000);
  try {
    const res = await fetch('https://v1.hitokoto.cn/?c=i&c=k&encode=json&max_length=16', { signal: ctl.signal, cache: 'no-store' });
    const j = await res.json();
    if (j && j.hitokoto) {
      document.querySelectorAll('.quote').forEach(el => { el.textContent = '「' + j.hitokoto + '」'; });
    }
  } catch (e) {
    /* 静默回退：保留上一次的句子 */
  } finally {
    clearTimeout(timer);
  }
}
document.querySelectorAll('.quote').forEach(el => el.addEventListener('click', refreshQuote));
if (new URLSearchParams(location.search).has('live')) refreshQuote();
const q = new URLSearchParams(location.search);
if (q.has('blur')) range.value = q.get('blur');
applyBlur(+range.value);
</script>
</body>
</html>
